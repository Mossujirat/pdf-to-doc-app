[project]
name = "pdf-to-doc"
version = "0.1.0"
description = "Convert Thai and English PDF/DOCX files to DOCX or AI-ready Markdown without broken text"
authors = [
    { name = "Sujirat Attawibulkul", email = "sujirat.attawibulkul@gmail.com" }
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.4",
    "numpy==2.3.5",
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.2",
    "pydantic==2.14.1",
    "pymupdf==1.28.2",
    "pythainlp==5.4.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "rapidfuzz==3.14.6",
    "uvicorn==0.54.0",
]

[project.scripts]
pdf-to-doc = "pdf_to_doc.cli:main"
pdf-to-doc-eval = "pdf_to_doc.evaluate_cli:main"
pdf-to-doc-models = "pdf_to_doc.ocr_models:main"
pdf-to-doc-sandbox = "pdf_to_doc.sandbox:main"
pdf-to-doc-web = "pdf_to_doc.web.app:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["corpus", "tests"]
# Fast tests by default; `pytest -m ocr` runs real PaddleOCR (models from `pdf-to-doc-models`).
addopts = "-m 'not ocr'"
markers = ["ocr: reads with real PaddleOCR, so it needs the models and takes longer"]

[tool.mypy]
strict = true
files = ["src", "tests", "corpus"]
mypy_path = ["corpus", "tests"]
# PyMuPDF ships only partial type hints.
untyped_calls_exclude = ["pymupdf"]

# PaddleOCR ships no type hints, nor does lxml, which python-docx parses with.
[[tool.mypy.overrides]]
module = ["paddleocr", "lxml"]
ignore_missing_imports = true
